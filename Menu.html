<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KG Restaurant - Menu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: darkslategrey;
      color: #ffffff;
    }

    .card img {
      height: 80px;
      width: 80px;
      object-fit: cover;
    }

    .form-check-label {
      font-size: 1.1rem;
    }

    .btn-primary {
      width: 100%;
      font-weight: bold;
      padding: 12px;
    }

    .card {
      background-color: antiquewhite;
      border: 1px solid #566e81;
    }
  </style>
</head>
<body>
  <div class="container mt-4">
    <h2 class="text-center mb-4">Select Your Favorite Meals</h2>
    <form id="menuForm">
      <div class="row row-cols-1 row-cols-md-3 g-4">
        <!-- Pizza -->
        <div class="col">
          <div class="card p-2">
            <div class="row g-0 align-items-center">
              <div class="col-8">
                <input type="checkbox" name="items" value="Pizza" class="form-check-input" id="pizza">
                <label class="form-check-label ms-2" for="pizza">Pizza - KES 300</label>
              </div>
              <div class="col-4">
                <img src="pizza.jpg" alt="Pizza" class="img-fluid rounded">
              </div>
            </div>
          </div>
        </div>

        <!-- Chicken Curry -->
        <div class="col">
          <div class="card p-2">
            <div class="row g-0 align-items-center">
              <div class="col-8">
                <input type="checkbox" name="items" value="Chicken Curry" class="form-check-input" id="curry">
                <label class="form-check-label ms-2" for="curry">Chicken Curry - KES 250</label>
              </div>
              <div class="col-4">
                <img src="chicken curry.jpg" alt="Chicken Curry" class="img-fluid rounded">
              </div>
            </div>
          </div>
        </div>

        <!-- Chapati -->
        <div class="col">
          <div class="card p-2">
            <div class="row g-0 align-items-center">
              <div class="col-8">
                <input type="checkbox" name="items" value="Chapati" class="form-check-input" id="chapati">
                <label class="form-check-label ms-2" for="chapati">Chapati - KES 30</label>
              </div>
              <div class="col-4">
                <img src="chapati.jpg" alt="Chapati" class="img-fluid rounded">
              </div>
            </div>
          </div>
        </div>

        <!-- Pilau -->
        <div class="col">
          <div class="card p-2">
            <div class="row g-0 align-items-center">
              <div class="col-8">
                <input type="checkbox" name="items" value="Pilau" class="form-check-input" id="pilau">
                <label class="form-check-label ms-2" for="pilau">Pilau - KES 150</label>
              </div>
              <div class="col-4">
                <img src="pilau.jpg" alt="Pilau" class="img-fluid rounded">
              </div>
            </div>
          </div>
        </div>

        <!-- Ugali with Kales -->
        <div class="col">
          <div class="card p-2">
            <div class="row g-0 align-items-center">
              <div class="col-8">
                <input type="checkbox" name="items" value="Ugali with Kales" class="form-check-input" id="ugali">
                <label class="form-check-label ms-2" for="ugali">Ugali with Kales - KES 80</label>
              </div>
              <div class="col-4">
                <img src="ugali.png" alt="Ugali with Kales" class="img-fluid rounded">
              </div>
            </div>
          </div>
        </div>

        <!-- Mandazi -->
        <div class="col">
          <div class="card p-2">
            <div class="row g-0 align-items-center">
              <div class="col-8">
                <input type="checkbox" name="items" value="Mandazi" class="form-check-input" id="mandazi">
                <label class="form-check-label ms-2" for="mandazi">Mandazi - KES 20</label>
              </div>
              <div class="col-4">
                <img src="mandazi.jpg" alt="Mandazi" class="img-fluid rounded">
              </div>
            </div>
          </div>
        </div>

        <!-- Smoothie -->
        <div class="col">
          <div class="card p-2">
            <div class="row g-0 align-items-center">
              <div class="col-8">
                <input type="checkbox" name="items" value="Smoothie" class="form-check-input" id="smoothie">
                <label class="form-check-label ms-2" for="smoothie">Smoothie - KES 120</label>
              </div>
              <div class="col-4">
                <img src="smothie.jpg" alt="Smoothie" class="img-fluid rounded">
              </div>
            </div>
          </div>
        </div>

        <!-- Cocktail -->
        <div class="col">
          <div class="card p-2">
            <div class="row g-0 align-items-center">
              <div class="col-8">
                <input type="checkbox" name="items" value="Cocktail" class="form-check-input" id="cocktail">
                <label class="form-check-label ms-2" for="cocktail">Cocktail - KES 150</label>
              </div>
              <div class="col-4">
                <img src="cocktail.jpg" alt="Cocktail" class="img-fluid rounded">
              </div>
            </div>
          </div>
        </div>

        <!-- Tea Masala -->
        <div class="col">
          <div class="card p-2">
            <div class="row g-0 align-items-center">
              <div class="col-8">
                <input type="checkbox" name="items" value="Tea Masala" class="form-check-input" id="tea">
                <label class="form-check-label ms-2" for="tea">Tea Masala - KES 40</label>
              </div>
              <div class="col-4">
                <img src="masala-tea.jpg" alt="Tea Masala" class="img-fluid rounded">
              </div>
            </div>
          </div>
        </div>

        <!-- Soda -->
        <div class="col">
          <div class="card p-2">
            <div class="row g-0 align-items-center">
              <div class="col-8">
                <input type="checkbox" name="items" value="Soda" class="form-check-input" id="soda">
                <label class="form-check-label ms-2" for="soda">Soda - KES 50</label>
              </div>
              <div class="col-4">
                <img src="soda.jpg" alt="Soda" class="img-fluid rounded">
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="text-center mt-4">
        <button type="submit" class="btn btn-primary">View Order Summary</button>
      </div>
    </form>
  </div>

  <script>
    document.getElementById('menuForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const selectedItems = [];
      const checkboxes = document.querySelectorAll('input[name="items"]:checked');
      checkboxes.forEach(cb => selectedItems.push(cb.value));
      localStorage.setItem('orderItems', JSON.stringify(selectedItems));
      window.location.href = "summary.html";
    });
  </script>
  <a href="index.html" class="btn btn-custom" style="color: red;">Back to  homepage</a>
</body>
</html>
