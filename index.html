<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>class="display-4">Welcome to KG Restaurant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: darkgrey;

      font-family: 'Segoe UI', sans-serif;
    }

    .hero {
      background-image: url('food.jpg');
      background-size: cover;
      background-position: center center;
      height: 85vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #FFF8E1;
      text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.7);
      text-align: center;
      padding: 20px;
      margin: 0;
      background-repeat: no-repeat;
    }

    .logo {
      height: 100px;
      width: 100px;
    }

    .navbar {
      background-color: #FFF8E1;
    }

    .navbar-brand {
      color: #D32F2F;
      font-weight: bold;
    }

    .hero h1 {
      color: #D32F2F;
      font-size: 3rem;
      font-weight: bold;
    }

    .hero p.lead {
      font-style: italic;
      font-size: 1.5rem;
      color: #FFF8E1;
    }

    .hero p.fw-bold {
      color: #FBC02D;
      font-size: 1.25rem;
      font-weight: bold;
    }

    .btn-custom {
      background-color: #388E3C;
      color: #FFF8E1;
      border: none;
      padding: 10px 20px;
      font-weight: bold;
      transition: 0.3s ease;
    }

    .btn-custom:hover {
      background-color: #2E7D32;
      color: white;
    }
  </style>
</head>

<body>

  <!-- Header with Logo -->
  <nav class="navbar shadow-sm px-4">
    <a class="navbar-brand d-flex align-items-center" href="#">
      <img src="f.jpg" alt="KG Logo" class="logo me-2 rounded-circle">
      KG Restaurant
    </a>
    <P style="background-color: antiquewhite; font-size: x-large; color: black;"> DESIGNED BY SHANDAVINE CHEMUTAI</P>
  
  </nav>

  <!-- Hero Section -->
  <div class="hero">
    <h1 class="display-4">Welcome to KG Restaurant</h1>
    <p class="lead mb-1">Experience authentic taste and hospitality</p>
    <p class="fw-bold mb-3">We operate 24/7 — Located at Waiyaki Way, opposite Quickmart</p>

    <a href="Menu.html" class="btn btn-custom">View Our Menu</a>
  </div>

</body>

</html>
